name: Deploy GitHub Pages

on:
  push:
    branches:
      - missing-semester-my
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install eBook build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc qrencode chromium-browser fonts-noto-core fonts-noto-extra fonts-noto-ui-core
          python -m pip install --upgrade pip
          pip install Pillow qrcode

      - name: Build eBooks
        run: |
          chmod +x ./ebook/build-artifact.sh
          ./ebook/build-artifact.sh --year all --format all

      - name: Build with Jekyll
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
